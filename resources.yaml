apiVersion: v1
kind: Pod
metadata:
  name: annotations
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    purpose: poc
  annotations:
    imageregistry: "https://hub.docker.com/"
    jenkins_url: "https://jenkins.joindevops.com/build/job/roboshop/34"
spec:
  containers:
  - name: nginx
    image: nginx
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "150m"
