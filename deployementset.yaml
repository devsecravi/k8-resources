apiVersion: apps/v1
kind: Deployment
metadata:
  name: replicaset-demo
  labels:
    project: roboshop 
    environment: dev
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "moving  to alpine3.23-perl"

spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      tier: frontend
  # this is pod defination, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:stable-alpine3.23-perl
