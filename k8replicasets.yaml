apiVersion: v1
kind: ReplicaSet
metadata:
  name: replicaset-demo
  labels:
    project: roboshop 
    environment: dev
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      tier: frontend
  # this is pod defination, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx
